[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v 
    -s 
    --tb=short
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir
markers =
    smoke: Smoke tests (سريعة)
    e2e: End-to-end tests (كاملة)
    sales: Sales module tests
    purchase: Purchase module tests
    accounting: Accounting module tests
    regression: Regression tests
    slow: Slow tests
    screen: Screen Builder generic tests (config/screens)
log_cli = false
log_cli_level = INFO