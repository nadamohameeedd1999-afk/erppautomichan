name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q config engine pages utils tests web
      - name: Tests are collectable (no browser)
        run: python -m pytest --collect-only -q
      - name: Dashboard starts
        env:
          SECRET_KEY: ci
          SCHEDULER: "0"
        run: python -c "import sys; sys.path.insert(0, '.'); from web.app import app; print(len(app.url_map._rules), 'routes')"
