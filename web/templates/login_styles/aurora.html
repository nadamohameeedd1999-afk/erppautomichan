{# 2) Aurora color blobs that follow the mouse + card with a spinning gradient border #}
<style>
body{background:#05070d;color:#e5e7eb;
  --in-bg:#111827;--in-border:#1f2937;--in-text:#fff;--in-label:#6b7280;--focus:#22d3ee;--focus-ring:rgba(34,211,238,.15);--ic:#9ca3af;
  --link:#67e8f9;--hint-bg:#0b0f19;--btn-bg:linear-gradient(90deg,#06b6d4,#8b5cf6,#ec4899)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.top-langs{position:absolute;top:18px;inset-inline-end:18px;z-index:3}
.langs a{color:#d1d5db;border:1px solid #1f2937;background:#0b0f19} .langs a.on{border-color:#22d3ee;color:#67e8f9}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.card{pointer-events:auto;width:100%;max-width:410px;padding:2px;border-radius:24px;background:conic-gradient(from var(--a,0deg),#22d3ee,#a855f7,#f43f5e,#f59e0b,#22d3ee);animation:spin 6s linear infinite}
.inner{border-radius:22px;background:#0b0f19;padding:36px 32px}
.logo{margin:0 auto 16px;background:#111827;border:1px solid #1f2937;color:#67e8f9;box-shadow:0 0 40px rgba(34,211,238,.25)}
h1{text-align:center;background:linear-gradient(90deg,#67e8f9,#c084fc,#fb7185);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#9ca3af}
.btn{background-size:200% 100%;transition:background-position .5s}
.btn:hover{background-position:100% 0;filter:none}
@media (max-width:600px){body{overflow:auto}.wrap{position:relative;min-height:100vh}}
</style>

<canvas class="bg" id="aur"></canvas>
<div class="top-langs">{{ langs }}</div>
<div class="wrap"><div class="card"><div class="inner">
  <form method="POST" action="" class="login" autocomplete="on">
    <div class="logo">{{ logo_html }}</div>
    <h1>{{ site_name if ar else site_name_en }}</h1>
    <p class="sub">{{ 'أهلاً بيكي تاني — سجّلي دخولك' if ar else 'Welcome back — sign in' }}</p>
    {{ fields }}
    <p class="ver">ERP Test Automation v4.2</p>
  </form>
</div></div></div>

<script>
(function () {
  var c = document.getElementById('aur'), g = LG.fit(c), t = 0;
  addEventListener('resize', function () { g = LG.fit(c); });
  var B = [{c: '34,211,238', k: .05, ox: -.25, oy: -.2}, {c: '168,85,247', k: .03, ox: .25, oy: .15}, {c: '244,63,94', k: .02, ox: 0, oy: .3}, {c: '245,158,11', k: .015, ox: -.3, oy: .25}]
    .map(function (b) { b.x = .5; b.y = .5; return b; });
  LG.loop(function () {
    var x = g.x, w = g.w, h = g.h; t += .006;
    x.globalCompositeOperation = 'source-over'; x.fillStyle = '#05070d'; x.fillRect(0, 0, w, h);
    var tx = LG.M.x > -1000 ? (LG.M.x - g.ox) / w : .5 + Math.sin(t) * .2, ty = LG.M.y > -1000 ? (LG.M.y - g.oy) / h : .5 + Math.cos(t * 1.3) * .15;
    x.globalCompositeOperation = 'lighter';
    B.forEach(function (b, i) {
      var gx = tx + b.ox + Math.sin(t * (1 + i * .3) + i) * .08, gy = ty + b.oy + Math.cos(t * (1.2 + i * .2) + i) * .08;
      b.x += (gx - b.x) * b.k; b.y += (gy - b.y) * b.k; var R = Math.max(w, h) * .38;
      var gr = x.createRadialGradient(b.x * w, b.y * h, 0, b.x * w, b.y * h, R);
      gr.addColorStop(0, 'rgba(' + b.c + ',.45)'); gr.addColorStop(1, 'rgba(' + b.c + ',0)'); x.fillStyle = gr; x.fillRect(0, 0, w, h);
    });
    x.globalCompositeOperation = 'source-over'; x.fillStyle = 'rgba(255,255,255,.035)';
    for (var i = 0; i < w; i += 48) x.fillRect(i, 0, 1, h); for (var j = 0; j < h; j += 48) x.fillRect(0, j, w, 1);
  });
})();
</script>
