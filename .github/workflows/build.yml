name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q config engine pages utils tests web
      - name: Tests are collectable (no browser)
        run: python -m pytest --collect-only -q
      - name: Dashboard starts
        env:
          SECRET_KEY: ci
          SCHEDULER: "0"
        run: python -c "import sys; sys.path.insert(0, '.'); from web.app import app; print(len(app.url_map._rules), 'routes')"
      - name: Quick self-tests (no browser)
        run: python -m pytest selftest/test_units.py -q -p no:cacheprovider

  selftest:
    # the engine end-to-end on a fake ERP (selftest/mock_erp): items, attachments, pop-up, checks, edit, print,
    # negative test, chain, discovery. Catches a change that breaks something that used to work.
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cd selftest/mock_erp && npm install --no-audit --no-fund
      - name: Self-tests (Chrome on the runner)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          export CHROMEDRIVER_PATH="$CHROMEWEBDRIVER/chromedriver"
          xvfb-run -a python -m pytest selftest -q -p no:cacheprovider
